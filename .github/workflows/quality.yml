name: Quality (analyze + test)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.50 起要求 Gradle >= 9.3.1（本项目 wrapper 是 8.14），并且在推
          # package:material_ui 迁移（flutter/material.dart 已标 deprecated）。
          # 先把版本钉死在这里，避免 stable 一升级整条 Android 构建直接红掉；
          # 要升级请连带把 android/gradle/wrapper 与 material 迁移一起做。
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # error 级别必须为 0；info / warning 先不阻塞（存量较多，逐步收紧）。
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.50 起要求 Gradle >= 9.3.1（本项目 wrapper 是 8.14），并且在推
          # package:material_ui 迁移（flutter/material.dart 已标 deprecated）。
          # 先把版本钉死在这里，避免 stable 一升级整条 Android 构建直接红掉；
          # 要升级请连带把 android/gradle/wrapper 与 material 迁移一起做。
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 排除 @Tags(['integration'])：少数用例需要原生 JS 运行时 / 外部网络，
      # 不适合在 CI 容器内跑（本地可用 `flutter test --tags integration` 单独执行）。
      # 注意：test/integration/ 下的端到端用例**没有**打该标签，会在 CI 真实执行。
      - name: Flutter test
        run: flutter test --reporter expanded --exclude-tags integration
