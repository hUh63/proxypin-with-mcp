name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      # 签名材料只存在于仓库 Secrets（仓库为 public，绝不能提交 jks / 口令）。
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode signing keystore from Secrets
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_STORE_BASE64" ]; then
            echo "::error::RELEASE_STORE_BASE64 secret is not configured"
            exit 1
          fi
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "::error::RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS secret is not configured"
            exit 1
          fi
          echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/proxypin-release.jks"
          test -s "$RUNNER_TEMP/proxypin-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/proxypin-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/proxypin-release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null
          echo "keystore decoded, alias=$RELEASE_KEY_ALIAS"

      - name: Build Universal APK (all architectures)
        run: flutter build apk --release

      - name: Extract version (upstream #917)
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "version extracted: $VER"

      - name: Rename universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/proxypin-${{ steps.version.outputs.app_version }}-universal.apk"

      - name: Build Split APKs (per architecture)
        run: flutter build apk --release --split-per-abi

      - name: Rename split APKs
        run: |
          VER="${{ steps.version.outputs.app_version }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
            mv "$f" "build/app/outputs/flutter-apk/proxypin-${VER}-${abi}.apk"
          done

      - name: Verify every APK is signed with the release key
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          fail=0
          for apk in build/app/outputs/flutter-apk/proxypin-*.apk; do
            echo "== $apk"
            out=$("$APKSIGNER" verify --print-certs "$apk" 2>&1) || fail=1
            echo "$out"
            echo "$out" | grep -q "CN=proxypin" || {
              echo "::error::$apk is NOT signed with the release key (CN=proxypin)"
              fail=1
            }
          done
          exit $fail

      - name: List all built APKs
        run: ls -lh build/app/outputs/flutter-apk/proxypin-*.apk

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-all-apks
          path: build/app/outputs/flutter-apk/proxypin-*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/proxypin-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}