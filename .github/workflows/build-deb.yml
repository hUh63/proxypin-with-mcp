name: Build Linux DEB

# 上游 #560：提供 Linux 安装包（.deb），覆盖 amd64 与 arm64。
# 独立于 APK 构建流程：即使 Linux 桌面构建失败，也不会影响 Android Release。
#
# 架构说明：只构建 amd64。arm64 目前**无法产出**，原因是外部的（2026-09 核实）：
#   1) Flutter 官方没有 Linux arm64 的 SDK 产物（releases_linux.json 里只有 stable/linux/，
#      也不存在 releases_linux_arm64.json），arm64 runner 上 flutter-action 必然报
#      "Unable to determine Flutter version for channel: stable architecture: arm64"；
#   2) Flutter 也不允许从 x64 交叉编译过去 —— 试过 --target-platform linux-arm64 +
#      arm64 sysroot，工具链直接拒绝："Cross-build from Linux x64 host to Linux arm64
#      target is not currently supported."；
#   3) engine artifacts 也没有 linux-arm64（对应路径 404）。
# 所以这里不再挂一个注定失败的 job（会让整个 workflow 长期标红）。等 Flutter 官方
# 发布 Linux arm64 SDK 后，把 matrix 里的 arm64 项加回来即可（runner: ubuntu-24.04-arm）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build DEB (${{ matrix.arch }})
    # 注意：不要在这里加 continue-on-error。
    # 它并不能让本工作流"不阻塞其它产物"（各 workflow 本来就彼此独立），
    # 只会把构建失败吞掉、让 run 仍然显示 success。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Report Flutter SDK availability
        run: |
          if [ "${{ steps.flutter.outcome }}" = "success" ]; then
            echo "Flutter SDK 可用，继续构建 ${{ matrix.arch }} 产物"
          else
            echo "::warning::当前 runner 上 Flutter SDK 不可用（${{ matrix.arch }}），本次跳过该架构产物"
          fi

      - name: Enable Linux desktop
        if: steps.flutter.outcome == 'success'
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        if: steps.flutter.outcome == 'success'
        run: flutter pub get

      - name: Build Linux release
        if: steps.flutter.outcome == 'success'
        run: flutter build linux --release

      - name: Package DEB
        if: steps.flutter.outcome == 'success'
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          ARCH="${{ matrix.arch }}"
          cd build/linux/*/release
          rm -rf package
          mkdir -p package/DEBIAN package/usr/share/applications package/opt
          {
            echo "Package: proxypin"
            echo "Version: ${VER}"
            echo "Priority: optional"
            echo "Architecture: ${ARCH}"
            echo "Depends: ca-certificates, libgtk-3-0"
            echo "Section: utils"
            echo "Maintainer: hUh63"
            echo "Homepage: https://github.com/hUh63/proxypin-with-mcp"
            echo "Description: HTTP/HTTPS packet capture tool (ProxyPin fork)"
          } > package/DEBIAN/control
          if [ -f ../../../../linux/proxy-pin.desktop ]; then
            cp ../../../../linux/proxy-pin.desktop package/usr/share/applications/
          fi
          cp -r bundle package/opt/proxypin
          dpkg-deb --build package "proxypin-${VER}-linux-${ARCH}.deb"
          mv "proxypin-${VER}-linux-${ARCH}.deb" "$GITHUB_WORKSPACE/"

      - name: Upload DEB to Release (on tag)
        if: steps.flutter.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: proxypin-*-linux-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DEB as artifact
        if: steps.flutter.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-linux-${{ matrix.arch }}-deb
          path: proxypin-*-linux-*.deb
          retention-days: 30
