name: Build iOS (unsigned)

# 上游 #560 扩展：产出 iOS 未签名安装包（.ipa），随 tag Release 一起发布。
# 说明：CI 无 Apple 开发者证书，故使用 --no-codesign 构建；产物为未签名 .ipa，
#       需由使用者用自己的证书/工具（如 sideloadly/AltStore/重签）安装。
#       本工作流与 APK / 桌面流程彼此独立，互不阻塞。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (unsigned)
    # 注意：这里**不能**再用 continue-on-error。
    # job 级 continue-on-error 会吞掉 iOS 编译失败，让 workflow run 仍显示 success，
    # 而 Release 里会静默缺少 ios-unsigned.ipa（本仓曾因此误判两次）。
    # 另外它也无法实现"不阻塞其它产物"——各 workflow 本来就彼此独立。
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.50 起要求 Gradle >= 9.3.1（本项目 wrapper 是 8.14），并且在推
          # package:material_ui 迁移（flutter/material.dart 已标 deprecated）。
          # 先把版本钉死在这里，避免 stable 一升级整条 Android 构建直接红掉；
          # 要升级请连带把 android/gradle/wrapper 与 material 迁移一起做。
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          APP="build/ios/iphoneos/Runner.app"
          rm -rf Payload payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "proxypin-${VER}-ios-unsigned.ipa" Payload

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        # 同一个 tag 上并发创建 Release 时 GitHub API 会偶发 HttpError：
        # 编译/打包都已成功，这里失败不该把整个 job 判红（APK 那条仍强制）。
        continue-on-error: true
        with:
          files: proxypin-*-ios-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-ios-unsigned
          path: proxypin-*-ios-*.ipa
          retention-days: 30
