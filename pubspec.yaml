name: proxypin
description: ProxyPin
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.1+36

environment:
  # 与 pubspec.lock 的 sdks 段保持一致（code_forge 10.14.0 起要求 Dart ^3.13.2）
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.9
  dynamic_color: ^1.7.0
  pointycastle: ^4.0.0
  logger: ^2.7.0
  date_format: ^2.0.9
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  desktop_multi_window: ^0.3.0
  path_provider: ^2.1.5
  file_picker: ^12.3.0
  proxy_manager: ^0.0.3
  permission_handler: ^13.0.2
  flutter_toastr: ^1.0.3
  share_plus: ^13.3.0
  flutter_js: ^0.8.7
#  flutter_highlight: ^0.7.0
  flutter_desktop_context_menu: ^0.2.0
  device_info_plus: ^13.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  toastification: ^3.0.2
  get: ^4.7.3
  zstandard: ^1.5.0
  qr_flutter: ^4.1.0
  flutter_qr_reader_plus: ^1.0.6
  brotli: ^0.6.0
  html: ^0.15.6
  xml: ^7.0.1
  ffi: ^2.1.0
  win32audio: ^1.5.0
  scrollable_positioned_list_nic: ^0.0.2
  tray_manager: ^0.5.3
  code_forge: ^10.14.0
  archive: ^4.0.0
  http: ^1.2.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/certs/ca.crt
    - assets/certs/ca_key.pem
    - assets/icon.png
    - assets/icon.ico
    - assets/icon_foreground.png
    - assets/js/
    - docs/quick_start.md
    - docs/certificate_https.md
    - docs/features_tips.md
    - docs/capture_plan_guide.md
    - docs/security_audit_guide.md
    - docs/js_restore_guide.md
    - docs/fuzzer_guide.md
    - docs/overview.md
    - docs/ai_analysis.md
    - docs/script_guide.md
    - docs/rewrite_guide.md
    - docs/environment_guide.md
    - docs/report_server.md
    - docs/MCP_AUTOMATION_GUIDE.md
    - docs/WORKFLOW_TUTORIAL.md
    - docs/extension_guide.md
    - docs/platform_limits.md
    - docs/tun_mode_evaluation.md
    - CHANGELOG.md
    - README_CN.md
    - AGENTS.md