import java.util.Properties
import java.io.FileInputStream
import java.io.File

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 签名材料支持环境变量注入，便于把 jks / 口令从版本库移出（见 docs/signing.md）。
// 未设置时回退到仓库内的 key.properties，保证现有 CI 仍可出包。
def envOrProp = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProperties[propName]
}
def releaseStoreFile = envOrProp('RELEASE_STORE_FILE', 'storeFile')
def releaseStorePassword = envOrProp('RELEASE_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = envOrProp('RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = envOrProp('RELEASE_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace "com.network.proxy"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
//    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        // Shizuku UserService 需要 AIDL（android/app/src/main/aidl/...）。
        // AGP 8.x 默认关闭 aidl，必须显式开启，否则 IShellService 不会生成 Stub。
        aidl = true
    }

    packagingOptions {
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    defaultConfig {
        applicationId "com.network.proxy"
        // For more information, see: https://flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            // 有签名材料才配 signingConfig；缺失时产出 unsigned APK（CI 会用它自带的 key.properties）
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // 此前 debug 也用 release 签名：每次 `flutter run` 都产出与正式包同签名的
            // APK，一旦泄漏即可覆盖安装官方版本。debug 必须用系统的 debug 签名。
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}



dependencies {
    // Shizuku 标准 API：支持应用内弹出系统授权弹窗，并在 Shizuku 应用管理中可见
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Dhizuku 官方 API（把 Device Owner 权限共享给本应用）。
    // 之前这里没有依赖，Met 是用手工反射调用一个并不存在的包名（com.bmax.dhizuku /
    // me.bmax.dhizuku）实现的，导致授权与 shell 全部静默失效；现改为官方 API。
    // 注意两点：
    //   1) Dhizuku-API 的 minSdk = 26，本应用 minSdk 更低 => 需要在 AndroidManifest 用
    //      tools:overrideLibrary="com.rosan.dhizuku.api" 放开，且所有调用点先判断
    //      Build.VERSION.SDK_INT >= Build.VERSION_CODES.O；
    //   2) Dhizuku 的 DhizukuRequestPermissionListener 是 abstract class（不是 interface），
    //      反射 Proxy 无法构造，这也是必须用官方依赖的原因。
    implementation 'io.github.iamr0s:Dhizuku-API:2.5.3'
}
